name = "auracraft-studio-telegram-worker"
main = "index.js"
compatibility_date = "2024-09-23"

# Zero-Cost Free Tier Worker Configuration
# Free allowance: 100,000 requests per day across Cloudflare Edge
workers_dev = true

[vars]
ENVIRONMENT = "production"
# Set these deployment-specific values before publishing the Worker.
# BACKEND_API_URL = "https://your-backend.example.com"
# ALLOWED_ORIGINS = "https://your-frontend.example.com"

# Secrets to configure with `wrangler secret put <NAME>`:
# - API_AUTH_TOKEN (same value as the backend; never expose it to Vite)
# - TELEGRAM_WEBHOOK_SECRET (same value as the backend)
