<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Iridescent Aura Gradient -->
    <linearGradient id="auraGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Neon Cyan Glow -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Soft Aura Radiance Filter -->
    <filter id="auraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Core Crystal Sparkle Filter -->
    <filter id="crystalBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Emblem Container (Centered at 250, 250) -->
  <rect x="40" y="40" width="420" height="420" rx="80" fill="#0c101c" stroke="url(#auraGrad)" stroke-width="14" />

  <!-- Background Orbit Rings (Virtual 3D Gyroscope) -->
  <ellipse cx="250" cy="250" rx="155" ry="62" fill="none" stroke="url(#auraGrad)" stroke-width="3" opacity="0.38" transform="rotate(-25 250 250)" stroke-dasharray="10 8" />
  <ellipse cx="250" cy="250" rx="155" ry="62" fill="none" stroke="url(#neonCyan)" stroke-width="3" opacity="0.32" transform="rotate(25 250 250)" stroke-dasharray="8 6" />

  <!-- 3D Holographic Faceted "A" & Persona Shards (Centered) -->
  <!-- Left Wing Apex -->
  <polygon points="250,130 176,285 218,285 250,205" fill="#8b5cf6" opacity="0.9" filter="url(#crystalBloom)" />
  <polygon points="250,130 218,285 250,265" fill="#a855f7" opacity="0.8" />
  
  <!-- Right Wing Apex -->
  <polygon points="250,130 324,285 282,285 250,205" fill="#ec4899" opacity="0.9" filter="url(#crystalBloom)" />
  <polygon points="250,130 282,285 250,265" fill="#f43f5e" opacity="0.8" />

  <!-- Base Legs -->
  <polygon points="176,285 145,355 192,355 218,285" fill="url(#auraGrad)" />
  <polygon points="324,285 355,355 308,355 282,285" fill="url(#auraGrad)" />

  <!-- Center Floating Core Crystal (The Neural Synapse) -->
  <polygon points="250,225 282,272 250,320 218,272" fill="#06b6d4" opacity="0.95" filter="url(#auraGlow)" />
  <polygon points="250,225 250,320 218,272" fill="#38bdf8" opacity="0.75" />

  <!-- Audio Waveform Viseme Sparkles -->
  <circle cx="125" cy="250" r="5.5" fill="#38bdf8" filter="url(#auraGlow)" />
  <circle cx="375" cy="250" r="5.5" fill="#ec4899" filter="url(#auraGlow)" />
  <line x1="92" y1="250" x2="114" y2="250" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
  <line x1="386" y1="250" x2="408" y2="250" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
</svg>
