services:
  - type: web
    name: auracraft-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://auracraft-studio.netlify.app
      - key: API_ADMIN_KEY
        sync: false
    rootDir: apps/web-platform/backend
    healthCheckPath: /health
