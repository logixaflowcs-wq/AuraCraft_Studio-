services:
  - type: web
    name: auracraft-backend
    env: python
    region: singapore
    # FIX(free-tier-1): keep the API on Render Free; persistent app state is stored in Neon Postgres.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production
      - key: AURACRAFT_DATA_DIR
        value: /tmp/auracraft-data
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        value: https://auracraft-backend-dt1u.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://auracraft-studio.onrender.com
      - key: TELEGRAM_GROUP_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_ID
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_IMPORT_ALLOWED_HOSTS
        sync: false
    rootDir: apps/web-platform/backend
    healthCheckPath: /health

  - type: web
    name: auracraft-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: apps/web-platform/frontend
    envVars:
      # Set this to the deployed Cloudflare Worker origin in the Render dashboard.
      - key: VITE_API_URL
        sync: false
