name = "auracraft-studio-edge"
main = "index.js"
compatibility_date = "2024-11-10"

# Zero-Cost Free Tier Worker Configuration
# Free allowance: 100,000 requests per day across Cloudflare Edge
workers_dev = true

[vars]
ENVIRONMENT = "production"
BACKEND_API_URL = "https://auracraft-backend-dt1u.onrender.com"
ALLOWED_ORIGINS = "https://auracraft-studio.onrender.com"

[observability]
enabled = true

# Optional future object storage binding; enable only after creating the bucket.
# [[r2_buckets]]
# binding = "AURACRAFT_ASSETS"
# bucket_name = "auracraft-assets"

# Secrets to configure with `wrangler secret put <NAME>`:
# - API_AUTH_TOKEN (same value as the backend; never expose it to Vite)
# - TELEGRAM_WEBHOOK_SECRET (same value as the backend)
