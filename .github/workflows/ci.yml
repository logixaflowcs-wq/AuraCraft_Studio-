name: AuraCraft CI and Security Audit

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/web-platform/backend/requirements-dev.txt
      - name: Install backend and audit dependencies
        run: pip install -r apps/web-platform/backend/requirements-dev.txt
      - name: Ruff
        run: ruff check apps/web-platform/backend
      - name: Mypy
        # Resolve the backend package root so app.persistence is checked as part of the package.
        run: MYPYPATH=apps/web-platform/backend mypy apps/web-platform/backend/app/main.py
      - name: Pytest
        run: pytest -q apps/web-platform/backend/tests
      - name: Python dependency audit (fail closed)
        run: pip-audit --local --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: NPM dependency audit (high severity gate)
        run: npm audit --audit-level=high

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-platform/backend/cloudflare_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/backend/cloudflare_worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/auracraft-worker-dist
      - run: npm audit --audit-level=high
