{
  "name": "auracraft-studio",
  "version": "2.0.0",
  "buildCommand": "npm run build",
  "outputDirectory": "dist",
  "installCommand": "npm install",
  "framework": "vite",
  "rewrites": [
    { "source": "/(.*)", "destination": "/index.html" }
  ],
  "env": {
    "VITE_API_URL": {
      "description": "AuraCraft Backend API URL (e.g. https://auracraft-backend.onrender.com)"
    }
  }
}
